name: TaskFlow - testes e publicação
on:
  push:
    branches: [iteracao2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskflow-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taskflow-test-results
          path: .demo-artifacts
      - run: mkdir -p public/demo && find .demo-artifacts -path '*DEMO-8MIN*' -name '*.webm' -type f -print -quit | xargs -r -I {} cp {} public/demo/taskflow-demo.webm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
