<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><link rel="stylesheet" href="styles.css"></head><body>
<section id="auth" class="auth"><div class="card"><h1>TaskFlow</h1><p>Organize seus projetos acadêmicos.</p><h2 id="authTitle">Entrar</h2><form id="authForm"><input id="name" placeholder="Nome completo" hidden><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required><button id="submit">Entrar</button></form><p id="msg"></p><button class="link" id="toggle">Criar uma conta</button><small>Protótipo acadêmico. Dados salvos neste navegador.</small></div></section>
<div id="app" hidden><aside><h2>TaskFlow</h2><button id="boardNav">Quadro de tarefas</button><button id="reports">Relatórios</button><footer><b id="who"></b><button id="logout">Sair</button></footer></aside><main><header><h1 id="heading">Quadro de tarefas</h1><div><input id="search" placeholder="Buscar tarefa"><button id="new">+ Nova tarefa</button></div></header><div id="board" class="board"></div><section id="report" hidden><div id="stats" class="stats"></div><div class="card"><h2>Distribuição das tarefas</h2><div id="bars"></div></div></section></main></div>
<dialog id="dialog"><form id="taskForm"><h2>Detalhes da tarefa</h2><input id="id" type="hidden"><label>Título<input id="title" required></label><label>Descrição<textarea id="desc"></textarea></label><label>Prazo<input id="due" type="date"></label><label>Responsável<input id="owner"></label><label>Situação<select id="status"><option value="todo">A fazer</option><option value="doing">Em andamento</option><option value="done">Concluído</option></select></label><button type="submit">Salvar</button><button type="button" id="cancel">Cancelar</button></form></dialog><script src="app.js"></script></body></html>
